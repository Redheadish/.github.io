<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>
    {% if page.title and page.title != "" %}
      {{ page.title }} |
    {% endif %}
    {{ site.title }}
  </title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="nav">
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/topics/' | relative_url }}">Topics</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>

<main class="site-main">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <p>© {{ site.title }}</p>
  </div>
</footer>

<!-- GoatCounter: set stable page path -->
<script>
  window.goatcounter = {
    path: location.pathname || "/"
  };
</script>

<!-- GoatCounter: main tracking script, records the visit -->
<script
  data-goatcounter="https://rh-notes.goatcounter.com/count"
  src="https://gc.zgo.at/count.js">
</script>

<!-- GoatCounter: show article views as plain text using JSON -->
<script>
(function () {
  function normalisePath(path) {
    if (!path || path === "") {
      return "/";
    }

    try {
      const url = new URL(path, window.location.origin);
      return url.pathname;
    } catch (error) {
      return path.charAt(0) === "/" ? path : "/" + path;
    }
  }

  function initPostViewCounter() {
    const counter = document.getElementById("goatcounter-views");

    if (!counter) {
      return;
    }

    let path = counter.dataset.goatcounterPath || location.pathname || "/";
    path = normalisePath(path);

    const counterUrl =
      "https://rh-notes.goatcounter.com/counter/" +
      encodeURIComponent(path) +
      ".json";

    fetch(counterUrl, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("GoatCounter returned HTTP " + response.status);
        }

        return response.json();
      })
      .then(function (data) {
        counter.textContent = data.count || "0";
      })
      .catch(function (error) {
        counter.textContent = "views unavailable";
        console.warn("GoatCounter counter error:", error);
        console.warn("GoatCounter counter URL:", counterUrl);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPostViewCounter);
  } else {
    initPostViewCounter();
  }
})();
</script>

</body>
</html>
