<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>
    {% if page.title and page.title != "" %}
      {{ page.title }} |
    {% endif %}
    {{ site.title }}
  </title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="nav">
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/topics/' | relative_url }}">Topics</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>

<main class="site-main">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <p>© {{ site.title }}</p>
  </div>
</footer>

<!-- GoatCounter: set stable page path -->
<script>
  window.goatcounter = {
    path: location.pathname || "/"
  };
</script>

<!-- GoatCounter: main tracking script -->
<script
  data-goatcounter="https://rh-notes.goatcounter.com/count"
  src="https://gc.zgo.at/count.js">
</script>

<!-- GoatCounter: show article views -->
<script>
(function () {
  function initPostViewCounter() {
    const counter = document.getElementById("goatcounter-views");

    if (!counter) {
      return;
    }

    const path = counter.dataset.goatcounterPath || location.pathname || "/";

    if (window.goatcounter && window.goatcounter.visit_count) {
      counter.textContent = "";

      window.goatcounter.visit_count({
        append: "#goatcounter-views",
        path: path,
        no_branding: true,
        type: "html"
      });
    } else {
      counter.textContent = "views unavailable";
      console.warn("GoatCounter loaded, but visit_count is not available.");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPostViewCounter);
  } else {
    initPostViewCounter();
  }
})();
</script>

</body>
</html>
